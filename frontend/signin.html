<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7Movies Sign In</title>
    <link rel="stylesheet" href="styles.css">
</head>

<!-- Main body of the Sign-in page -->
<body class="auth-page">

    <!-- This is the bar that runs across the top part of the site, houses only the Site Name on this page -->
    <header class="topbar">
        <a class="brand" href="index.html">7Movies</a>
        <div class="space-bar"></div>
    </header>

    <main class="auth-card">
        <h1>Welcome back</h1>
        <p class="extraText">Sign in to your 7Movies account</p>

        <form id="signinForm" class="auth-form">
            <label>
                Username or email
                <input
                    name="identity"
                    type="text"
                    autocomplete="username"
                    required
                    placeholder="Username or email"
                >
            </label>

            <label>
                Password
                <input
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                    placeholder="Enter password"
                >
            </label>

            <button class="primary" type="submit">Sign In</button>
            <p id="authMessage" class="form-message" aria-live="polite"></p>
        </form>

        <p class="extraText">Don't have an account? <a href="create-account.html">Create Account</a></p>
    </main>

    <script type="module" src="auth.js"></script>
</body>
</html>
