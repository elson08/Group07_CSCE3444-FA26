<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7Movies Profile</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html">7Movies</a>
        <nav class="site-nav">
            <a href="index.html">Home</a>
            <a href="browse.html">Browse</a>
            <a class="active" href="profile.html#watchlist">Watchlist</a>
        </nav>
        <form class="search" action="browse.html">
            <input name="q" type="search" placeholder="Search movies and shows" aria-label="Search movies and shows">
            <button type="submit" aria-label="Search">⌕</button>
        </form>
        <div class="header-account" data-account></div>
    </header>

    <main class="container">
        <p id="pageMessage" class="no-results">Loading your profile...</p>

        <div id="profilePage" hidden>
            <section class="profile-head panel">
                <span id="profileInitial" class="avatar large"></span>
                <div>
                    <h1 id="profileName"></h1>
                    <p id="profileMeta" class="extraText"></p>
                </div>
                <div class="actions">
                    <button id="signOut" class="btn btn-ghost" type="button">Sign out</button>
                </div>
            </section>

            <nav class="tabs" role="tablist">
                <button type="button" role="tab" data-tab="watchlist">Watchlist</button>
                <button type="button" role="tab" data-tab="watched">Watched</button>
                <button type="button" role="tab" data-tab="ratings">Ratings &amp; reviews</button>
                <button type="button" role="tab" data-tab="services">My services</button>
                <button type="button" role="tab" data-tab="account">Account</button>
            </nav>

            <section id="watchlist" class="tab-panel" hidden>
                <div class="search-add">
                    <input id="watchlistSearch" class="field" type="search" placeholder="Add a title..." autocomplete="off" aria-label="Search for a title to add">
                    <div id="watchlistResults" class="profile-search-results" hidden></div>
                </div>
                <p id="watchlistStatus" class="form-status" aria-live="polite"></p>
                <div class="results-head">
                    <label>
                        Sort by
                        <select id="watchlistSort">
                            <option value="recent">Recently added</option>
                            <option value="services">On my services first</option>
                            <option value="az">A to Z</option>
                        </select>
                    </label>
                </div>
                <div id="watchlistGrid" class="results-grid"></div>
            </section>

            <section id="watched" class="tab-panel" hidden>
                <div id="watchedGrid" class="results-grid"></div>
            </section>

            <section id="ratings" class="tab-panel" hidden>
                <div id="ratingList" class="rating-list"></div>
            </section>

            <section id="services" class="tab-panel" hidden>
                <input id="serviceSearch" class="field service-search" type="search" placeholder="Find a service..." aria-label="Find a service">
                <div id="serviceTiles" class="service-tiles"></div>
            </section>

            <section id="account" class="tab-panel" hidden>
                <div class="account-grid">
                    <form id="detailsForm" class="panel form-grid">
                        <h2>Account details</h2>
                        <label>
                            Username
                            <input name="username" type="text" autocomplete="username" required>
                        </label>
                        <label>
                            Email
                            <input name="email" type="email" autocomplete="email" required>
                        </label>
                        <button class="btn btn-primary" type="submit">Save changes</button>
                        <p class="form-status" aria-live="polite"></p>
                    </form>

                    <form id="passwordForm" class="panel form-grid">
                        <h2>Change password</h2>
                        <label>
                            Current password
                            <input name="current" type="password" autocomplete="current-password" required>
                        </label>
                        <label>
                            New password
                            <input name="next" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
                        </label>
                        <label>
                            Confirm new password
                            <input name="confirm" type="password" autocomplete="new-password" required>
                        </label>
                        <button class="btn" type="submit">Update password</button>
                        <p class="form-status" aria-live="polite"></p>
                    </form>

                    <form id="deleteForm" class="panel form-grid danger-zone">
                        <h2>Delete account</h2>
                        <p>This deletes all your data.</p>
                        <label>
                            Password
                            <input name="password" type="password" autocomplete="current-password" required>
                        </label>
                        <button class="btn btn-danger" type="submit">Delete my account</button>
                        <p class="form-status" aria-live="polite"></p>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <script src="app.js"></script>
    <script src="profile.js"></script>
</body>
</html>
