<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7Movies</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html">7Movies</a>
        <nav class="site-nav">
            <a href="index.html">Home</a>
            <a href="browse.html">Browse</a>
            <a href="profile.html#watchlist">Watchlist</a>
        </nav>
        <form class="search" action="browse.html">
            <input name="q" type="search" placeholder="Search movies and shows" aria-label="Search movies and shows">
            <button type="submit" aria-label="Search">⌕</button>
        </form>
        <div class="header-account" data-account></div>
    </header>

    <main class="container">
        <p id="pageMessage" class="no-results">Loading title...</p>

        <div id="titlePage" hidden>
            <section id="titleHero" class="title-hero"></section>

            <div id="titleGrid" class="title-grid">
                <section class="panel">
                    <h2>Where to watch</h2>
                    <ul id="whereToWatch" class="where-list"></ul>
                </section>

                <section id="trailer" class="panel">
                    <h2>Trailer</h2>
                    <div class="video-wrap">
                        <iframe
                            id="trailerFrame"
                            title="Trailer"
                            allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            referrerpolicy="strict-origin-when-cross-origin"
                            allowfullscreen
                        ></iframe>
                    </div>
                </section>
            </div>

            <section id="similarSection" class="panel" hidden>
                <div class="row-head">
                    <h2>More like this</h2>
                </div>
                <div id="similar" class="scroller"></div>
            </section>

            <section id="reviews" class="panel">
                <div class="row-head">
                    <h2>Reviews</h2>
                </div>

                <form id="reviewForm" class="review-form" hidden>
                    <div id="reviewStars" class="stars"></div>
                    <textarea name="review" maxlength="2000" placeholder="Your review..."></textarea>
                    <div class="rating-actions">
                        <button class="btn btn-primary" type="submit">Post review</button>
                        <button id="deleteRating" class="btn btn-ghost" type="button" hidden>Delete my rating</button>
                    </div>
                    <p id="reviewStatus" class="form-status" aria-live="polite"></p>
                </form>

                <p id="reviewSignIn" class="extraText" hidden><a href="signin.html">Sign in</a> to rate and review this title.</p>
                <div id="reviewList"></div>
            </section>
        </div>
    </main>

    <script src="app.js"></script>
    <script src="movie.js"></script>
</body>
</html>
